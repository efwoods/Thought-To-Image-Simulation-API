name: Build and Deploy to Docker Hub and GCP Cloud Run

on:
  push:
    branches:
      - main

env:
  IMAGE_BASE_NAME: evdev3/thought-to-image-simulation-api
  IMAGE_TAG: ${{ github.sha }}
  FULL_IMAGE_NAME: evdev3/thought-to-image-simulation-api:${{ github.sha }}

  SERVICE_NAME: thought-to-image-simulation-api
  REGION: us-east1
  PROJECT_ID: neuralnexus-467517

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: docker.io/${{ env.IMAGE_BASE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=docker.io/${{ env.IMAGE_BASE_NAME }}:buildcache
          cache-to: type=registry,ref=docker.io/${{ env.IMAGE_BASE_NAME }}:buildcache,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
            project_id: ${{ env.PROJECT_ID }}
          
      - name: Deploy to Cloud Run
        run: |
          export IMAGE_BASE_NAME=${{env.IMAGE_BASE_NAME}}
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          export FULL_IMAGE_NAME=${{ env.FULL_IMAGE_NAME }}
          export SERVICE_NAME=${{ env.SERVICE_NAME }}
          export REGION=${{ env.REGION }}
              
          gcloud run deploy $SERVICE_NAME \
            --image=docker.io/$IMAGE_BASE_NAME:$IMAGE_TAG \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=IMAGE_DECODER_PATH="models/image_decoder.pt",RESIZED_IMAGE_SIZE=64,LATENT_DIM=128,REDIS_HOST=redis,REDIS_PORT=6379,REDIS_USERNAME=red-d25qupur433s73dvusdg,REDIS_PASSWORD=3f4c7d127bdbf8c0be1dbaa16b7d0875f0ea03f44f26d8d925b1e6ddbc9a78e,USE_PERCEPTUAL_LOSS=FALSE,NORMALIZATION_CONFIG="models/electrode_global_mean_std.json",IMAGE_ENCODER_PATH="models/image_encoder.pt",WAVEFORM_DECODER_PATH="models/waveform_decoder.pt",WAVEFORM_ENCODER_PATH="models/waveform_encoder.pt",WAVEFORM_DICT_PATH="data/collected_stimulus_waveforms.pkl",IMAGE_DICT_PATH="data/image_paths_dict.pkl",TEST_METADATA_PATH="data/test_dataset_metadata.pkl",API_URL="api.neuralnexus.site" \
            --memory=1Gi
